[package]
name = "doppler-examples"
description = "Examples on how to use Doppler."
authors = { workspace = true }
repository = { workspace = true }
readme = { workspace = true }
license-file = { workspace = true }
edition = { workspace = true }
version = { workspace = true }

[dependencies]
doppler-program = { workspace = true }
doppler-sdk = { workspace = true, features = ["bootstrap"] }
solana-client = { workspace = true }
solana-keypair = { workspace = true }
solana-pubkey = { workspace = true }
solana-signer = { workspace = true }
solana-sdk = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[[bin]]
name = "single-price-feed"
path = "src/single_price_feed.rs"

[[bin]]
name = "multiple-price-feed"
path = "src/multiple_price_feed.rs"

[[bin]]
name = "devnet-oracle-setup"
path = "src/devnet_oracle_setup.rs"
